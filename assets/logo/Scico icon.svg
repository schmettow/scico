<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Scico mark for buttons and message headers.

  GPUI paints every SVG icon as a monochrome alpha mask, so this variant uses
  transparent gaps between the rings instead of overlapping filled discs.
  The full-colour original is kept as "Scico icon colour.svg".
-->
<svg
   version="1.1"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="28.5" fill="none" stroke="currentColor" stroke-width="5" />
  <circle cx="32" cy="32" r="19" fill="none" stroke="currentColor" stroke-width="4" />
  <circle cx="32" cy="32" r="9" fill="currentColor" />
  <ellipse
     cx="45"
     cy="17"
     rx="3"
     ry="1.7"
     transform="rotate(-17 45 17)"
     fill="currentColor" />
</svg>
