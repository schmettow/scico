[package]
name = "sciscraper-gpui"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A scientific Markdown editor with integrated RAG co-writing and reference management"
readme = "README.md"
repository = "https://github.com/schmettow/sciscraper-gpui"
keywords = ["markdown", "editor", "rag", "llm", "gpui"]
categories = ["text-editors", "gui"]

[features]
default = ["gpuikit"]
# Cargo features are additive. If both backends are enabled (for example with
# `--features zorite` on top of the default, or `--all-features`), build.rs
# selects zorite so the two editor implementations never collide.
zorite = ["dep:zorite-editor"]
gpuikit = ["dep:syntect"]

[dependencies]
blake3 = "1.5"
comrak = "0.22"
dirs = "5"
gpui-kit = "0.7.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
open = "5"
ragrig-gpui = { path = "../ragrig-gpui", version = "0.4.0", features = ["grobid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-onig"], optional = true }
zorite-editor = { version = "0.11.2", optional = true }

[dev-dependencies]
gpui-kit = { version = "0.7.3", features = ["test-support"] }
